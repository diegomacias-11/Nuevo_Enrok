<form method="get" class="filter-form-simple citas-filter">
  {% if source %}
    <input type="hidden" name="source" value="{{ source }}">
  {% endif %}
  {% if request.GET.next %}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
  {% endif %}
  <div class="filter-block filter-block-range">
    <label>Fecha</label>
    <div class="filter-range-fields">
      <input type="date" id="fecha_desde" name="fecha_desde" value="{{ fecha_desde }}" aria-label="Fecha desde" />
      <input type="date" id="fecha_hasta" name="fecha_hasta" value="{{ fecha_hasta }}" aria-label="Fecha hasta" />
    </div>
  </div>
  <span class="filter-separator" aria-hidden="true"></span>
  <div class="filter-block">
    <label for="prospecto">Prospecto</label>
    <input type="text" id="prospecto" name="prospecto" value="{{ prospecto }}" placeholder="Buscar prospecto" />
  </div>
  <span class="filter-separator" aria-hidden="true"></span>
  <div class="filter-block">
    <label for="alianza">Alianza</label>
    <select id="alianza" name="alianza">
      <option value="">Todos</option>
      <option value="True" {% if alianza == "True" %}selected{% endif %}>Si</option>
      <option value="False" {% if alianza == "False" %}selected{% endif %}>No</option>
    </select>
  </div>
  <span class="filter-separator" aria-hidden="true"></span>
  <div class="filter-block">
    <label for="estatus_seguimiento">Estatus seguimiento</label>
    <select id="estatus_seguimiento" name="estatus_seguimiento">
      <option value="">Todos</option>
      {% for value, label in estatus_seguimiento_choices %}
        <option value="{{ value }}" {% if value == estatus_seguimiento %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="filter-block">
    <label for="vendedor">Vendedor</label>
    <select id="vendedor" name="vendedor">
      <option value="">Todos</option>
      {% for value, label in vendedor_choices %}
        <option value="{{ value }}" {% if value == vendedor %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="filter-actions">
    <button type="submit" class="btn-filter btn-filtrar">Filtrar</button>
    <a href="{% url 'citas_lista' %}" class="btn-filter btn-limpiar">Limpiar</a>
  </div>
</form>
